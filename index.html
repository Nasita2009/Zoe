<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe 💖</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Feliz mes mi niña 🥳💖</h1>

<div class="contenedor">
    <div class="carta-wrapper" onclick="abrirCarta()">
        <img src="carta.jpg" class="carta" alt="carta">
        <div class="tap">Tócame 💖</div>
    </div>
</div>

<!-- HOJA -->
<div class="hoja" id="hoja">

    <div class="fondo-cielo"></div>

    <!-- corazones -->
    <div class="corazones-hoja" id="corazones"></div>

    <div class="hoja-contenido">

        <div class="titulo-hoja">
            💖 Un mes contigo 💖
        </div>

        <div class="contenido">
            <p>
            Hoy es un día especial, celebramos un mes siendo novios...
            💖
            </p>
        </div>

    </div>

</div>

<script>
function abrirCarta(){
    document.getElementById("hoja").classList.add("mostrar");

    if (navigator.vibrate) {
        navigator.vibrate(50);
    }
}

/* generar corazones */
const contenedor = document.getElementById("corazones");

for (let i = 0; i < 20; i++) {
    let span = document.createElement("span");
    span.innerHTML = "💖";

    span.style.left = Math.random() * 100 + "%";
    span.style.animationDelay = Math.random() * 5 + "s";
    span.style.fontSize = (16 + Math.random() * 20) + "px";

    contenedor.appendChild(span);
}
</script>

</body>
</html>
